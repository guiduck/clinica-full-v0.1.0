services:
  postgres:
    image: postgres:16-alpine
    container_name: clinica-agil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinica_agil
      POSTGRES_USER: clinica
      POSTGRES_PASSWORD: clinica
    ports:
      - "5433:5432"
    volumes:
      - clinica_agil_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinica -d clinica_agil"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clinica-agil-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - clinica_agil_redis:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  clinica_agil_postgres:
  clinica_agil_redis: